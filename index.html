<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picly</title>
<style>
:root{--line:#dbdbdb;--muted:#737373;--blue:#0095f6}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}button,input,textarea{font:inherit}.hidden{display:none!important}
#auth{min-height:100vh;background:#fafafa;display:grid;place-items:center;padding:24px}.authbox{width:min(420px,100%);border:1px solid var(--line);background:#fff;padding:34px;text-align:center}.logo{font-family:cursive;font-size:42px;font-weight:800;margin-bottom:18px}.demoGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.demo{border:1px solid var(--line);background:#fff;padding:10px;border-radius:9px;display:flex;gap:9px;align-items:center;text-align:left}.demo:hover{background:#f7f7f7}.tiny{color:var(--muted);font-size:12px}.link{border:0;background:none;color:var(--blue);font-weight:700}.authbox input{width:100%;padding:11px;margin:5px 0;border:1px solid var(--line);background:#fafafa;border-radius:4px}.primary{width:100%;margin-top:10px;border:0;background:var(--blue);color:#fff;padding:10px;border-radius:8px;font-weight:700}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;border-right:1px solid var(--line);padding:26px 14px;background:#fff;z-index:20}.sideLogo{font-family:cursive;font-size:31px;font-weight:800;padding:0 12px 26px}.nav{display:flex;gap:14px;align-items:center;width:100%;border:0;background:transparent;padding:13px 14px;border-radius:10px;margin:3px 0;text-align:left}.nav:hover,.nav.active{background:#f2f2f2}.nav.active{font-weight:700}.ico{font-size:21px;width:23px;text-align:center}.main{margin-left:245px}.page{max-width:935px;margin:auto;padding:28px 20px 80px}.mobileTop,.mobileBar{display:none}
.feed{display:grid;grid-template-columns:minmax(0,630px) 280px;gap:36px}.stories{display:flex;gap:14px;overflow:auto;padding:8px 2px 18px}.story{min-width:72px;text-align:center;font-size:12px}.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#feda75,#d62976,#4f5bd5);margin:auto}.inner{width:100%;height:100%;padding:3px;background:#fff;border-radius:50%}.ava,.mini,.big{border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#fb7185,#8b5cf6);font-weight:800}.ava{width:100%;height:100%;font-size:20px}.mini{width:38px;height:38px}.big{width:150px;height:150px;font-size:58px}
.post{padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--line)}.postHead{display:flex;gap:10px;align-items:center;padding:9px 2px}.postPhoto{aspect-ratio:1/1;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:70px;font-weight:900;border:1px solid #eee}.g1{background:linear-gradient(135deg,#fb7185,#f59e0b,#8b5cf6)}.g2{background:linear-gradient(135deg,#0ea5e9,#22c55e)}.g3{background:linear-gradient(135deg,#111827,#7c3aed,#ec4899)}.g4{background:linear-gradient(135deg,#f97316,#fde047)}.g5{background:linear-gradient(135deg,#06b6d4,#2563eb)}.actions{display:flex;gap:14px;padding:12px 2px 8px}.icon{border:0;background:none;font-size:23px;padding:0}.liked{color:#ef4444}.likes{font-weight:700;font-size:14px;margin-bottom:6px}.caption{font-size:14px;line-height:1.45}.comment{display:flex;margin-top:8px}.comment input{flex:1;border:0;outline:none;padding:8px 0}.comment button{border:0;background:none;color:var(--blue);font-weight:700}
.sideInfo{padding-top:22px}.person{display:flex;gap:10px;align-items:center;margin-bottom:14px}.grow{flex:1}.muted{color:var(--muted);font-size:13px}.blue{border:0;background:none;color:var(--blue);font-weight:700;font-size:12px}
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tile{aspect-ratio:1/1;display:grid;place-items:center;color:#fff;font-size:48px;font-weight:900;cursor:pointer}.search{margin-bottom:20px}.search input{width:100%;border:0;background:#efefef;padding:12px 14px;border-radius:9px;outline:none}.userrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f0}.userrow .mini{width:48px;height:48px}.userrow button{margin-left:auto;border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 13px;font-weight:700}
.profileHead{display:grid;grid-template-columns:180px 1fr;gap:48px;align-items:center;padding:30px 0}.profileTop{display:flex;gap:12px;align-items:center}.profileTop h2{font-weight:400}.stats{display:flex;gap:32px;margin:20px 0}.profileGrid{border-top:1px solid var(--line);padding-top:20px}
.msgLayout{height:calc(100vh - 58px);display:grid;grid-template-columns:320px 1fr;border:1px solid var(--line)}.chatList{border-right:1px solid var(--line);overflow:auto}.chatTitle{padding:20px;border-bottom:1px solid var(--line);font-weight:700}.chatPerson{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}.chatPerson:hover,.chatPerson.active{background:#f5f5f5}.chatPerson .mini{width:50px;height:50px}.chatPanel{display:flex;flex-direction:column}.chatHead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:70%;background:#efefef;padding:10px 13px;border-radius:18px;font-size:14px}.mine{align-self:flex-end;background:#3797f0;color:#fff}.send{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.send input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 14px}.send button{border:0;background:none;color:var(--blue);font-weight:700}
.createBox{max-width:600px;margin:40px auto;border:1px solid var(--line);border-radius:14px;overflow:hidden}.createTitle{text-align:center;font-weight:700;border-bottom:1px solid var(--line);padding:14px}.createBody{padding:20px}.createBody textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:9px;padding:12px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.swatch{height:60px;border:3px solid transparent;border-radius:9px}.swatch.sel{border-color:#111}
@media(max-width:900px){.sidebar{width:76px}.sideLogo{font-size:0}.sideLogo:after{content:"P";font:900 28px Arial}.nav span:last-child{display:none}.main{margin-left:76px}.feed{grid-template-columns:1fr}.sideInfo{display:none}}
@media(max-width:650px){.sidebar{display:none}.main{margin-left:0}.mobileTop{display:flex;height:52px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10;align-items:center;justify-content:space-between;padding:0 14px}.mobileTop .logo{font-size:28px;margin:0}.mobileBar{display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;align-items:center}.mobileBar button{border:0;background:none;font-size:22px}.page{padding:12px 10px 70px}.msgLayout{height:calc(100vh - 122px);grid-template-columns:115px 1fr}.chatPerson{justify-content:center;padding:10px 5px}.chatPerson .grow{display:none}.profileHead{grid-template-columns:95px 1fr;gap:20px}.big{width:90px;height:90px;font-size:38px}.stats{gap:12px;font-size:13px}.tile{font-size:32px}}
</style>
</head>
<body>
<div id="auth"><div class="authbox"><div class="logo">Picly</div><div id="loginPane"><input id="loginUser" placeholder="Usuário"><input id="loginPass" type="password" placeholder="Senha"><button class="primary" id="loginBtn">Entrar</button><div id="loginMsg" class="tiny" style="min-height:18px;margin-top:10px"></div><div style="margin-top:16px"><button class="link" id="showCreate">Criar conta temporária</button></div></div><div id="createAccount" class="hidden"><input id="newName" placeholder="Nome completo"><input id="newUser" placeholder="Nome de usuário"><button class="primary" id="createAccountBtn">Criar e entrar</button><div style="margin-top:14px"><button class="link" id="backChoose">Voltar</button></div></div></div></div>

<div id="app" class="hidden">
<aside class="sidebar"><div class="sideLogo">Picly</div>
<button class="nav active" data-page="home"><span class="ico">⌂</span><span>Início</span></button>
<button class="nav" data-page="search"><span class="ico">⌕</span><span>Pesquisa</span></button>
<button class="nav" data-page="explore"><span class="ico">▦</span><span>Explorar</span></button>
<button class="nav" data-page="messages"><span class="ico">✉</span><span>Mensagens</span></button>
<button class="nav" data-page="create"><span class="ico">＋</span><span>Criar</span></button>
<button class="nav" data-page="profile"><span class="ico">◉</span><span>Perfil</span></button>
<button class="nav" id="logoutBtn"><span class="ico">↪</span><span>Sair</span></button></aside>
<header class="mobileTop"><div class="logo">Picly</div><button class="icon" data-page="messages">✉</button></header>
<main class="main"><div id="page" class="page"></div></main>
<nav class="mobileBar"><button data-page="home">⌂</button><button data-page="explore">▦</button><button data-page="create">＋</button><button data-page="messages">✉</button><button data-page="profile">◉</button></nav>
</div>

<script>
const accounts=[
 {username:"lucas",name:"Lucas Martins",bio:"Fotografia urbana • São Paulo",emoji:"📸",passHash:"85228f0e"},
 {username:"mari",name:"Mariana Souza",bio:"Design, cores e café",emoji:"🎨",passHash:"b3ea0725"},
 {username:"pedrolima",name:"Pedro Lima",bio:"Código, música e jogos",emoji:"💻",passHash:"b189509e"},
 {username:"juliaalves",name:"Julia Alves",bio:"Gastronomia e viagens",emoji:"🍜",passHash:"5be20e1e"},
 {username:"carlos",name:"Carlos Mendes",bio:"Corrida e vida saudável",emoji:"🏃",passHash:"422972be"},
 {username:"bia",name:"Beatriz Rocha",bio:"Música, shows e fotos antigas",emoji:"🎧",passHash:"9de91ae1"},
 {username:"rafa",name:"Rafael Nunes",bio:"Skate e vídeo",emoji:"🛹",passHash:"ed19eb9a"}
];
let current=null,pageName="home",selectedChat="mari",chosenGrad="g1";const createdPosts=[],likes={},comments={};
const posts=[
{id:1,user:"mari",emoji:"🎨",grad:"g1",symbol:"SUNSET",caption:"Fim de tarde e cores novas ✨",likes:128,time:"2 h"},
{id:2,user:"pedrolima",emoji:"💻",grad:"g3",symbol:"CODE",caption:"Depois de quebrar tudo 4 vezes, finalmente funcionou 😅",likes:84,time:"4 h"},
{id:3,user:"juliaalves",emoji:"🍜",grad:"g4",symbol:"FOOD",caption:"Receita nova saindo hoje 🍜",likes:203,time:"6 h"},
{id:4,user:"carlos",emoji:"🏃",grad:"g2",symbol:"5KM",caption:"Treino de hoje concluído.",likes:76,time:"8 h"},
{id:5,user:"bia",emoji:"🎧",grad:"g5",symbol:"MUSIC",caption:"Essa playlist salvou minha semana.",likes:141,time:"1 d"},
{id:6,user:"rafa",emoji:"🛹",grad:"g3",symbol:"SK8",caption:"Tentativa 23 finalmente deu certo.",likes:96,time:"1 d"}];
const chats={
lucas:{mari:[["mari","mano apaga aquele story de ontem kkkkk"],["lucas","qual deles? 😭"],["mari","o que eu tava cantando errado no fundo"],["lucas","já salvaram antes de eu apagar kkkkk"],["mari","NÃO ACREDITO 😭😭"]],pedrolima:[["pedrolima","tu terminou o trabalho de história?"],["lucas","nem comecei"],["pedrolima","eu usei metade do modelo antigo e mudei umas partes 💀"],["lucas","se o professor perguntar eu nunca vi essa mensagem kkkkk"]],juliaalves:[["juliaalves","não conta pra ninguém mas eu falei que tava doente pra não ir no treino"],["lucas","e tu postou foto no shopping 20 min depois 😭"],["juliaalves","EU ESQUECI QUE ELE ME SEGUE"]]},
mari:{bia:[["bia","tu contou pro lucas que eu acho ele bonito?"],["mari","claro que não"],["bia","certeza??"],["mari","100%"],["bia","porque ele começou a curtir TODOS meus stories do nada 😭"]],carlos:[["carlos","eu disse que sabia cozinhar pra impressionar ela"],["mari","e sabe?"],["carlos","queimei miojo ontem."],["mari","KKKKKKK boa sorte"]]},
pedrolima:{rafa:[["rafa","foi tu que colocou meu nome naquele slide ridículo?"],["pedrolima","talvez"],["rafa","tava escrito especialista em chegar atrasado"],["pedrolima","mentira não era kkkkk"]]}};
const $=s=>document.querySelector(s),acct=u=>accounts.find(a=>a.username===u),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function enter(a){current=a;$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");render()}function logout(){current=null;$("#app").classList.add("hidden");$("#auth").classList.remove("hidden")}
function nav(p){pageName=p;render();window.scrollTo(0,0)}function stories(){return '<div class="stories">'+accounts.map(a=>'<div class="story" onclick="openProfile(\''+a.username+'\')"><div class="ring"><div class="inner"><div class="ava">'+a.emoji+'</div></div></div><div>'+a.username+'</div></div>').join("")+'</div>'}
function postCard(p){const l=!!likes[p.id];return '<article class="post"><div class="postHead"><div class="mini">'+p.emoji+'</div><b>@'+p.user+'</b><span class="muted">• '+p.time+'</span></div><div class="postPhoto '+p.grad+'">'+esc(p.symbol)+'</div><div class="actions"><button class="icon '+(l?'liked':'')+'" onclick="toggleLike('+p.id+')">'+(l?'♥':'♡')+'</button><button class="icon" onclick="focusComment('+p.id+')">◯</button><button class="icon">⌁</button></div><div class="likes">'+(p.likes+(l?1:0))+' curtidas</div><div class="caption"><b>@'+p.user+'</b> '+esc(p.caption)+'</div>'+((comments[p.id]||[]).map(c=>'<div class="caption" style="margin-top:5px"><b>@'+current.username+'</b> '+esc(c)+'</div>').join(""))+'<div class="comment"><input id="c'+p.id+'" placeholder="Adicione um comentário..."><button onclick="addComment('+p.id+')">Publicar</button></div></article>'}
function home(){return '<div class="feed"><div>'+stories()+[...createdPosts,...posts].map(postCard).join("")+'</div><aside class="sideInfo"><div class="person"><div class="mini">'+current.emoji+'</div><div class="grow"><b>@'+current.username+'</b><div class="muted">'+esc(current.name)+'</div></div></div><div class="muted" style="font-weight:700;margin:20px 0 12px">Sugestões para você</div>'+accounts.filter(a=>a.username!==current.username).slice(0,5).map(a=>'<div class="person"><div class="mini">'+a.emoji+'</div><div class="grow"><b>@'+a.username+'</b><div class="muted">'+esc(a.name)+'</div></div><button class="blue">Seguir</button></div>').join("")+'</aside></div>'}
function explore(){return '<div class="explore">'+[...createdPosts,...posts,...posts.slice(0,3)].map(p=>'<div class="tile '+p.grad+'" onclick="openProfile(\''+p.user+'\')">'+esc(p.symbol)+'</div>').join("")+'</div>'}
function userRows(list){return list.map(a=>'<div class="userrow"><div class="mini">'+a.emoji+'</div><div><b>@'+a.username+'</b><div class="muted">'+esc(a.name)+'</div></div><button onclick="openProfile(\''+a.username+'\')">Ver perfil</button></div>').join("")}function searchPage(){return '<div class="search"><input id="q" placeholder="Pesquisar" oninput="doSearch()"></div><div id="results">'+userRows(accounts)+'</div>'}function doSearch(){const q=$("#q").value.toLowerCase();$("#results").innerHTML=userRows(accounts.filter(a=>a.username.includes(q)||a.name.toLowerCase().includes(q)))}
function profilePage(user=current.username){const a=acct(user)||current,up=[...createdPosts,...posts].filter(p=>p.user===a.username);return '<div class="profileHead"><div class="big">'+a.emoji+'</div><div><div class="profileTop"><h2>@'+a.username+'</h2><button class="blue">'+(a.username===current.username?'Editar perfil':'Seguir')+'</button></div><div class="stats"><span><b>'+up.length+'</b> publicações</span><span><b>'+((a.username.length*83)%900+120)+'</b> seguidores</span><span><b>'+((a.username.length*17)%300+80)+'</b> seguindo</span></div><b>'+esc(a.name)+'</b><div style="margin-top:6px">'+esc(a.bio||"")+'</div></div></div><div class="profileGrid explore">'+(up.length?up.map(p=>'<div class="tile '+p.grad+'">'+esc(p.symbol)+'</div>').join(""):'<div class="muted">Nenhuma publicação ainda.</div>')+'</div>'}function openProfile(u){pageName="profile";$("#page").innerHTML=profilePage(u)}
function threads(){const own=chats[current.username]||{},rev={};Object.entries(chats).forEach(([owner,t])=>Object.entries(t).forEach(([peer,msgs])=>{if(peer===current.username)rev[owner]=msgs}));return {...rev,...own}}
function messagesPage(){const t=threads(),peers=Object.keys(t);if(peers.length&&!peers.includes(selectedChat))selectedChat=peers[0];if(!peers.length){const f=accounts.find(a=>a.username!==current.username);selectedChat=f.username;t[selectedChat]=[]}return '<div class="msgLayout"><div class="chatList"><div class="chatTitle">@'+current.username+'</div>'+Object.keys(t).map(u=>{const a=acct(u);return '<div class="chatPerson '+(u===selectedChat?'active':'')+'" onclick="selectChat(\''+u+'\')"><div class="mini">'+(a?a.emoji:"🙂")+'</div><div class="grow"><b>@'+u+'</b><div class="muted">Ver conversa</div></div></div>'}).join("")+'</div><div class="chatPanel">'+chatPanel(selectedChat,t[selectedChat]||[])+'</div></div>'}
function chatPanel(peer,msgs){const a=acct(peer)||{emoji:"🙂",name:peer};return '<div class="chatHead"><div class="mini">'+a.emoji+'</div><div><b>@'+peer+'</b><div class="muted">'+esc(a.name)+'</div></div></div><div class="messages">'+msgs.map(m=>'<div class="bubble '+(m[0]===current.username?'mine':'')+'">'+esc(m[1])+'</div>').join("")+'</div><div class="send"><input id="newMsg" placeholder="Mensagem..."><button onclick="sendMessage(\''+peer+'\')">Enviar</button></div>'}
function selectChat(u){selectedChat=u;render()}function sendMessage(peer){const v=$("#newMsg").value.trim();if(!v)return;if(!chats[current.username])chats[current.username]={};if(!chats[current.username][peer])chats[current.username][peer]=[];chats[current.username][peer].push([current.username,v]);render()}
function createPage(){return '<div class="createBox"><div class="createTitle">Criar nova publicação</div><div class="createBody"><textarea id="cap" placeholder="Escreva uma legenda..."></textarea><div class="palette">'+["g1","g2","g3","g4","g5"].map((g,i)=>'<button class="swatch '+g+(i===0?' sel':'')+'" data-grad="'+g+'" onclick="pickGrad(this)"></button>').join("")+'</div><input id="symbol" maxlength="12" placeholder="Texto da imagem" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:8px"><button class="primary" onclick="createPost()">Compartilhar</button></div></div>'}function pickGrad(el){chosenGrad=el.dataset.grad;document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel"));el.classList.add("sel")}function createPost(){const cap=$("#cap").value.trim(),sym=$("#symbol").value.trim()||"PICLY";createdPosts.unshift({id:1000+createdPosts.length,user:current.username,emoji:current.emoji,grad:chosenGrad,symbol:sym.toUpperCase(),caption:cap||"Nova publicação ✨",likes:0,time:"agora"});nav("home")}
function toggleLike(id){likes[id]=!likes[id];render()}function focusComment(id){$("#c"+id)?.focus()}function addComment(id){const e=$("#c"+id);if(!e||!e.value.trim())return;(comments[id]||(comments[id]=[])).push(e.value.trim());render()}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===pageName));const p=$("#page");if(pageName==="home")p.innerHTML=home();else if(pageName==="explore")p.innerHTML=explore();else if(pageName==="search")p.innerHTML=searchPage();else if(pageName==="messages")p.innerHTML=messagesPage();else if(pageName==="create")p.innerHTML=createPage();else p.innerHTML=profilePage()}
function labHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,"0")}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>nav(b.dataset.page));$("#logoutBtn").onclick=logout;
$("#loginBtn").onclick=()=>{const u=$("#loginUser").value.trim().toLowerCase().replace(/^@/,""),p=$("#loginPass").value,a=acct(u);if(!a||a.passHash!==labHash(p)){$("#loginMsg").textContent="Usuário ou senha incorretos.";return}$("#loginMsg").textContent="";enter(a)};
$("#showCreate").onclick=()=>{$("#loginPane").classList.add("hidden");$("#createAccount").classList.remove("hidden")};
$("#backChoose").onclick=()=>{$("#createAccount").classList.add("hidden");$("#loginPane").classList.remove("hidden")};
$("#createAccountBtn").onclick=()=>{const name=$("#newName").value.trim(),u=$("#newUser").value.trim().toLowerCase().replace(/[^a-z0-9._]/g,"");if(!name||u.length<3){alert("Preencha nome e usuário.");return}if(accounts.some(a=>a.username===u)){alert("Esse usuário já existe.");return}const a={username:u,name,bio:"Conta temporária desta sessão",emoji:"🙂",temporary:true};accounts.push(a);enter(a)};
</script></body></html>
